name: acceptance

# M1 acceptance needs a real kernel (NFS server/client modules) and Docker —
# GitHub's ubuntu runners have both, so this also covers dev machines that
# can't run kernel NFS locally.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  accept-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install kind and kubectl
        run: |
          curl -sLo kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kind kubectl && sudo mv kind kubectl /usr/local/bin/
      - name: Load NFS kernel modules
        run: sudo modprobe nfs && sudo modprobe nfsd
      - run: make accept-m1
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n minifiles get all,pvc || true
          kubectl -n minifiles get events | tail -30 || true
          kubectl -n minifiles describe pod m1-client | tail -25 || true
          echo "=== data-plane (nfs-godzilla) logs ==="
          for p in $(kubectl -n minifiles get pods -l minifiles.io/volume-id -o name); do
            kubectl -n minifiles logs "$p" --tail=80 || true
          done
          echo "=== control-plane logs ==="
          kubectl -n minifiles logs deploy/control-plane --tail=60 || true
