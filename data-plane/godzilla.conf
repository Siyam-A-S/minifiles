# NFSv4-only (no rpcbind/portmapper needed; single port 2049).
NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    # PR_SET_IO_FLUSHER needs CAP_SYS_RESOURCE; tolerate its absence so the
    # pod can stay unprivileged with no added capabilities.
    Allow_Set_IO_Flusher_Fail = true;
    # v3-era services that register with rpcbind — there is no portmapper in
    # this pod, and NFSv4 needs neither.
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSv4 {
    # No client state to recover on a fresh pod; skip the grace period so
    # mounts succeed immediately after startup.
    Graceless = true;
}

EXPORT {
    Export_Id = 1;
    Path = /exports;
    # Not "/": that is the server's built-in read-only pseudo root — an export
    # grafted there is shadowed and clients get a read-only filesystem.
    Pseudo = /data;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    FSAL {
        Name = VFS;
    }
}
