apiVersion: v1
kind: ConfigMap
metadata:
  name: minifiles-dashboard
  namespace: minifiles
  labels:
    grafana_dashboard: "1" # picked up by the kube-prometheus-stack sidecar
data:
  minifiles.json: |
    {
      "uid": "minifiles",
      "title": "MiniFiles",
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-3h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Volumes by state",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [{"expr": "sum by (state) (minifiles_volumes)", "legendFormat": "{{state}}"}]
        },
        {
          "id": 2, "type": "stat", "title": "Provisioned GiB",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 8},
          "targets": [{"expr": "minifiles_provisioned_gib"}]
        },
        {
          "id": 3, "type": "stat", "title": "Snapshots",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 8},
          "targets": [{"expr": "minifiles_snapshots"}]
        },
        {
          "id": 4, "type": "timeseries", "title": "API p95 latency",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{
            "expr": "histogram_quantile(0.95, sum by (le) (rate(minifiles_http_request_duration_seconds_bucket[5m])))",
            "legendFormat": "p95"
          }]
        },
        {
          "id": 5, "type": "stat", "title": "Bytes tiered (last run)",
          "gridPos": {"x": 12, "y": 8, "w": 6, "h": 8},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [{"expr": "max(minifiles_tiering_last_bytes)"}]
        },
        {
          "id": 6, "type": "stat", "title": "Since last tiering success",
          "gridPos": {"x": 18, "y": 8, "w": 6, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{"expr": "time() - max(minifiles_tiering_last_success_timestamp)"}]
        }
      ],
      "schemaVersion": 39
    }
