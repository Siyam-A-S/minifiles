apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: minifiles
spec:
  replicas: 1  # in-memory store; do not scale until a real store lands
  # Recreate: with an in-memory store, an old and new pod must never serve
  # at the same time (requests would see two divergent stores).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      serviceAccountName: control-plane
      # Cap shutdown: background reconcile loops may be mid-poll; don't let
      # graceful drain hold the (single) replica slot for minutes.
      terminationGracePeriodSeconds: 10
      containers:
        - name: control-plane
          image: minifiles/control-plane:dev
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: control-plane-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: minifiles
  labels:
    app: control-plane  # ServiceMonitor selects services by label
spec:
  selector:
    app: control-plane
  ports:
    - name: http  # named so the ServiceMonitor can reference it
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: control-plane-config
  namespace: minifiles
data:
  MINIFILES_MAX_TOTAL_GIB: "100"
  MINIFILES_PROVISIONER: "memory"  # dev overlay flips this to "kubernetes"
  MINIFILES_NAMESPACE: "minifiles"
  MINIFILES_NFS_IMAGE: "minifiles/nfs-godzilla:dev"
  MINIFILES_STORAGE_CLASS: "standard"
  MINIFILES_PROVISION_TIMEOUT_S: "120"
  MINIFILES_TIERING_ENABLED: "false"  # dev overlay enables; needs the Azure secret
  MINIFILES_TIERING_IMAGE: "minifiles/tiering-engine:dev"
  MINIFILES_TIERING_SCHEDULE: "0 * * * *"
  MINIFILES_COLD_AFTER_DAYS: "30"
  MINIFILES_AZURE_SECRET_NAME: "minifiles-azure"
  MINIFILES_PUSHGATEWAY_URL: ""  # azure overlay points this at the monitoring stack
