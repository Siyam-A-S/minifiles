# The control plane provisions data-plane resources (M1): it needs to manage
# StatefulSets, PVCs, and Services in its own namespace — and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: minifiles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-provisioner
  namespace: minifiles
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # per-volume tiering CronJobs and on-demand rehydrate Jobs
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-provisioner
  namespace: minifiles
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-provisioner
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: minifiles
